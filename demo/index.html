<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width'></head><body><title>혜택AI 데모</title>
<style>
/* 혜택AI 웹 — 토스 디자인 시스템(TDS) 문법, 브랜드 컬러만 그린.
   그레이 배경 + 보더 없는 흰 카드 + 8pt 간격 그리드 + 잉크/세컨더리 타이포 */
:root {
  --bg:#F2F4F6; --card:#ffffff; --inset:#F6F8FA; --ink:#191F28; --muted:#6B7684; --line:#EEF1F4;
  --brand:#059669; --brand-dark:#047857; --brand-soft:#E8F5EF;
  --accent:#B45309; --accent-soft:#FFF7EB; --accent-line:#F3E4C8; --ad:#8B95A1;
  --available:#047857; --pending:#B45309; --reversed:#D22030;
  --arrow:#B0B8C1;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 18px; }
body {
  margin: 0; font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  background: var(--bg); color: var(--ink); line-height: 1.55; padding-bottom: 88px;
  /* 한국어 어절 단위 줄바꿈 — 단어 중간에서 꺾이지 않아 시니어 가독성이 크게 좋아진다 */
  word-break: keep-all; overflow-wrap: break-word;
}
.topbar {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: 15px 24px; background: var(--bg);
}
.brand { font-size: 1.35rem; font-weight: 900; }
.brand span { color: var(--brand); }
.wallet-mini { font-size: .95rem; color: var(--muted); font-weight: 700; }
.wallet-mini b { color: var(--brand); font-size: 1.15rem; }

main { padding: 20px 24px; max-width: 640px; margin: 0 auto; }
h2.title { font-size: 1.55rem; font-weight: 900; margin: 4px 0 16px; }
.sub { color: var(--muted); margin: -8px 0 16px; }

/* 토스식 카드: 보더 없이 흰 서피스만으로 구분(배경이 그레이라 충분히 분리됨) */
.card { background: var(--card); border: 0; border-radius: 20px; padding: 20px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: 1.15rem; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; align-items: center; }
.row .k { color: var(--muted); }
.row .v { font-weight: 800; text-align: right; }
.big-amount { font-size: 2rem; font-weight: 900; }

button, .btn {
  font: inherit; cursor: pointer; border: 0; border-radius: 16px; padding: 15px 18px; min-height: 56px; font-weight: 700;
}
.btn-primary { background: var(--brand); color: #fff; width: 100%; font-size: 1.15rem; }
.btn-primary:active { background: var(--brand-dark); }
.btn-ghost { background: var(--brand-soft); color: var(--brand); }
.btn-line { background: #fff; border: 1.5px solid var(--brand); color: var(--brand); }
.btn:disabled, button:disabled { opacity: .5; }

/* 오퍼 카드 */
.offer { background: var(--accent-soft); border: 0; }
.offer .toprow { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.ad-label { background: var(--ad); color: #fff; font-size: .78rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.advertiser { font-weight: 800; }
.cat-tag { margin-left:auto; color: var(--muted); font-weight: 700; font-size: .85rem; }
.offer .inset { background: var(--card); border-radius: 14px; padding: 14px; margin-top: 6px; }
.offer .inset .divider { height:1px; background:var(--line); margin:4px 0; }
.chips { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.chip { border-radius:999px; padding:6px 11px; font-weight:800; font-size:.82rem; }
.chip.ok { background: var(--brand-soft); color: var(--brand); }
.chip.warn { background: #f9ede0; color: var(--accent); }
.accent { color: var(--accent); }

/* 상태 pill */
.pill { display:inline-flex; align-items:center; gap:6px; font-size:.85rem; font-weight:800; padding:5px 11px; border-radius:999px; }
.pill.pending { background:#faf1e6; color:var(--pending); }
.pill.available { background:var(--brand-soft); color:var(--available); }
.pill.reversed { background:#fbe9e6; color:var(--reversed); }
.pill.paid { background:var(--inset); color:var(--muted); }

/* 하단 탭 */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: grid; grid-template-columns: repeat(6,1fr);
  background: var(--card); border-top: 1px solid var(--line);
}
.tabbar button {
  background: none; border-radius: 0; min-height: 66px; color: var(--muted); font-size: .8rem; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px;
}
.tabbar button .ic { display:flex; } .tabbar button .ic svg { width:23px; height:23px; }
.tabbar button.active { color: var(--brand); }

/* AI 홈 */
.hello { color: var(--muted); font-weight: 800; font-size: 1.05rem; }
.h-big { font-size: 2.1rem; font-weight: 900; line-height: 1.2; margin: 2px 0 0; }
.wallet-box { background: var(--brand-soft); border-radius: 16px; padding: 12px 16px; text-align:center; }
.wallet-box .l { color: var(--brand-dark); font-size:.8rem; font-weight:800; }
.wallet-box .v { color: var(--brand); font-size:1.25rem; font-weight:900; }
.voice-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  width:176px; height:176px; border-radius:50%; background:var(--brand); color:#fff; margin:8px auto 0;
  box-shadow: 0 10px 26px rgba(14,122,95,.35); border:0; cursor:pointer;
}
.voice-btn .mic { font-size:2.6rem; } .voice-btn .t { font-size:1.2rem; font-weight:800; }
.voice-hint { text-align:center; color:var(--muted); margin:14px 0 0; }
.ask { display: flex; gap: 10px; margin-top: 16px; align-items:center; background:var(--card); border-radius:18px; padding:6px 8px 6px 16px; box-shadow:0 2px 10px rgba(25,31,40,.06); }
.ask input { flex: 1; min-width: 0; font: inherit; padding: 12px 0; border: 0; outline:none; background:transparent; }
.ask button { white-space: nowrap; flex-shrink: 0; }
/* 토스식 리스트 행: 원형 아이콘 + 라벨 + 우측 화살표 */
.quick { display:flex; align-items:center; gap:14px; background:var(--card); border:0; border-radius:16px; padding:14px 16px; margin:8px 0 0; width:100%; text-align:left; cursor:pointer; }
.quick:active { background:var(--inset); }
.quick .e { width:40px; height:40px; border-radius:50%; background:var(--brand-soft); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0; } .quick .e svg { width:20px; height:20px; }
.quick .t { flex:1; font-size:1.02rem; font-weight:700; color:var(--ink); }
.quick::after { content:"›"; color:var(--arrow); font-size:1.4rem; font-weight:300; }
.quick-head { color:var(--muted); font-weight:800; margin:24px 0 4px; font-size:.9rem; }

/* 채팅 레이아웃 — 메시지는 위에서 아래로 쌓이고, 입력창은 하단(탭바 위)에 고정 */
.ai-chat { display:flex; flex-direction:column; min-height:calc(100vh - 66px - 66px); }
#thread { display:flex; flex-direction:column; padding-bottom:8px; }
.msg-row { margin-top:14px; }
.msg-row:first-child { margin-top:4px; }
/* 입력 도크 — 미션 진행 핀 + 입력창을 함께 하단 고정(핀이 스크롤에 묻히지 않게) */
.dock { position:sticky; bottom:74px; margin-top:auto; }
.chat-input { box-shadow:0 -8px 16px var(--bg); }

/* 대화 */
.user-bubble { align-self:flex-end; background:var(--brand); color:#fff; border-radius:20px; border-bottom-right-radius:6px; padding:13px 16px; font-weight:700; font-size:1.05rem; max-width:88%; margin:0 0 12px auto; width:fit-content; }
.answer .ai-badge-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.ai-badge { background:var(--brand-soft); color:var(--brand); font-weight:900; font-size:.78rem; padding:3px 8px; border-radius:8px; }
.answer .summary { font-size: 1.25rem; font-weight: 900; margin-bottom: 8px; }
.answer .section { margin: 10px 0; }
.answer .section .h { font-weight: 800; margin-bottom: 4px; }
.uncertain { background:var(--accent-soft); border:0; border-radius:12px; padding:12px; color:var(--accent); margin-top:12px; }

/* 세그먼트 */
.segbar { display:flex; background:var(--inset); border-radius:14px; padding:4px; margin-bottom:16px; }
.seg { flex:1; padding:11px; border-radius:11px; text-align:center; font-weight:800; color:var(--muted); background:none; min-height:auto; }
.seg.active { background:var(--card); color:var(--brand); box-shadow:0 1px 3px rgba(0,0,0,.06); }
.notice { background:var(--accent-soft); border:0; border-radius:12px; padding:13px; color:var(--accent); font-size:.9rem; margin-bottom:14px; }

/* 걷기 */
.steps-big { font-size: 3.2rem; font-weight: 900; text-align: center; color: var(--brand); }
.progress { height: 14px; background:var(--inset); border-radius:999px; overflow:hidden; margin:10px 0; }
.progress > i { display:block; height:100%; background:var(--brand); border-radius:999px; }
.milestones { display:flex; flex-wrap:wrap; gap:8px; }
.ms { width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem; border:0; min-height:auto; }
.ms.locked { background:var(--inset); color:#b6b1a4; }
.ms.claimable { background:var(--accent-soft); color:var(--accent); border:0; }
.ms.done { background:var(--brand-soft); color:var(--brand); }

.disclose { font-size:.85rem; color:var(--muted); background:var(--inset); border-radius:12px; padding:11px 13px; margin-top:10px; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 700; opacity: 0; transition: opacity .2s; z-index: 20; max-width: 90%; }
.toast.show { opacity: 1; }
.muted { color: var(--muted); } .center { text-align:center; } .mt { margin-top: 14px; }

/* 렌탈 상담 폼 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.lead-modal { background: var(--bg); border-top-left-radius: 24px; border-top-right-radius: 24px; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; padding: 22px; }
.lead-modal h3 { font-size: 1.35rem; }
.lead-modal .fl { display:block; color: var(--muted); font-weight: 700; font-size: .9rem; margin: 12px 0 6px; }
.lead-modal input[type=text], .lead-modal input:not([type]) { width: 100%; font: inherit; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
.lead-disclose { background: var(--accent-soft); border: 0; border-radius: 14px; padding: 14px; margin: 14px 0; color: var(--accent); font-size: .88rem; line-height: 1.7; }
.lead-check { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 16px; }
.lead-check input { width: 22px; height: 22px; }
.lead-modal .btn-primary { margin-bottom: 8px; }

/* ── 모던 UI/UX 리프레시 ─────────────────────────────────────────── */
/* 입력창 전송 버튼 — 원형 화살표 */
.send-btn { flex-shrink:0; width:46px; height:46px; border:0; border-radius:50%; background:var(--brand); color:#fff; font-size:1.4rem; font-weight:900; line-height:1; cursor:pointer; transition:transform .12s, background .12s; }
.send-btn:active { transform:scale(.92); background:var(--brand-dark); }

/* 큰 대화 시작 버튼(음성/입력 유도) */
.talk-btn { display:flex; align-items:center; gap:14px; width:100%; text-align:left; border:0; cursor:pointer;
  background:var(--brand); color:#fff; border-radius:20px; padding:16px; box-shadow:0 10px 26px rgba(14,122,95,.28); }
.talk-btn:active { transform:translateY(1px); }
.talk-btn .mic { width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
.talk-btn .tx { display:flex; flex-direction:column; flex:1; }
.talk-btn .tx b { font-size:1.15rem; font-weight:900; }
.talk-btn .tx .sub { font-size:.82rem; color:rgba(255,255,255,.85); margin-top:2px; }
.talk-btn .arw { font-size:1.6rem; font-weight:300; }

/* 타이핑 인디케이터(… 점 애니메이션) */
.card.typing { display:flex; gap:6px; align-items:center; }
.card.typing .dot { width:8px; height:8px; border-radius:50%; background:var(--brand); animation:typing 1.1s infinite ease-in-out; }
.card.typing .dot:nth-child(2){ animation-delay:.16s; } .card.typing .dot:nth-child(3){ animation-delay:.32s; }
@keyframes typing { 0%,80%,100%{ transform:translateY(0); opacity:.3 } 40%{ transform:translateY(-5px); opacity:1 } }

/* exploring — 부드러운 확장형 제안 */
.soft-sug { display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:var(--brand-soft); border:0; border-radius:18px; padding:14px 16px; margin-top:10px; }
.soft-sug:active { transform:translateY(1px); }
.soft-sug .e { font-size:1.3rem; }
.soft-sug .tx { display:flex; flex-direction:column; flex:1; }
.soft-sug .tx b { color:var(--brand-dark); font-size:1rem; }
.soft-sug .tx .sub { color:var(--brand); font-size:.85rem; font-weight:600; margin-top:2px; }
.soft-sug .tg { background:var(--brand); color:#fff; border-radius:12px; padding:7px 13px; font-weight:800; font-size:.85rem; }
.soft-body { animation:fadein .22s ease; }
@keyframes fadein { from{ opacity:0; transform:translateY(-4px) } to{ opacity:1; transform:none } }

/* 리워드 넛지(걷기/미션 바로가기) */
.nudge-chip { display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
  background:var(--accent-soft); border:0; border-radius:16px; padding:13px 16px; margin-top:10px; }
.nudge-chip:active { transform:translateY(1px); }
.nudge-chip .e { font-size:1.2rem; }
.nudge-chip .tx { flex:1; color:var(--accent); font-weight:800; font-size:.95rem; }
.nudge-chip .go { color:var(--accent); font-weight:800; font-size:.85rem; }

/* 토스쇼핑식 상품 행 */
.p-row { display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:0; border-radius:16px; padding:14px 16px; margin-bottom:8px; min-height:auto; }
.p-row:active { background:var(--inset); }
.p-thumb { width:56px; height:56px; border-radius:14px; background:var(--inset); display:flex; align-items:center;
  justify-content:center; font-size:1.7rem; flex-shrink:0; }
.p-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.p-name { font-weight:700; color:var(--ink); font-size:.97rem; line-height:1.35; }
.p-price { font-weight:900; color:var(--ink); font-size:1.08rem; }
.p-meta { color:var(--muted); font-size:.8rem; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.p-cash { color:var(--brand); font-weight:800; font-size:.78rem; background:var(--brand-soft); border-radius:8px; padding:2px 7px; }
.p-arrow { color:var(--arrow); font-size:1.4rem; font-weight:300; flex-shrink:0; }

/* 스폰서 대화 미션 — 대화하면 돈 버는 루프 */
.m-head-row { display:flex; align-items:center; justify-content:space-between; margin:26px 0 10px; }
.m-head { font-weight:900; color:var(--ink); font-size:1rem; }
.streak-chip { color:var(--accent); font-weight:800; font-size:.78rem; background:var(--accent-soft); border-radius:999px; padding:4px 10px; }
.m-card { display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
  background:var(--card); border:0; border-radius:16px; padding:14px 16px; margin-bottom:8px; }
.m-card:active { background:var(--inset); }
.m-icon { width:40px; height:40px; border-radius:50%; background:var(--brand-soft); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; flex-shrink:0; } .m-icon svg { width:20px; height:20px; }
.m-card:active { transform:translateY(1px); }
.m-card.done { opacity:.55; cursor:default; }
.m-body { flex:1; display:flex; flex-direction:column; gap:3px; }
.m-title-row { display:flex; align-items:center; gap:7px; }
.m-title { font-weight:800; color:var(--ink); font-size:.97rem; min-width:0; }
.m-ad { background:var(--inset); color:var(--muted); font-weight:800; font-size:.62rem; padding:2px 6px; border-radius:6px; white-space:nowrap; flex-shrink:0; margin-right:6px; }
.m-sub { color:var(--muted); font-size:.82rem; display:flex; align-items:center; flex-wrap:wrap; }
.m-reward { background:var(--brand-soft); color:var(--brand); font-weight:900; font-size:.9rem; border-radius:12px; padding:8px 12px; white-space:nowrap; flex-shrink:0; }
.m-card.done .m-reward { background:var(--inset); color:var(--muted); }
.mission-bar { text-align:center; margin:0 4px 8px; padding:9px 14px; background:var(--brand); border-radius:999px;
  color:#fff; font-weight:800; font-size:.84rem; box-shadow:0 4px 12px rgba(46,125,91,.3); }
.mission-done { background:var(--brand-soft); border:0; border-radius:18px; padding:17px; margin-top:10px; text-align:center; }
.mission-done .md-title { color:var(--brand-dark); font-weight:900; font-size:1.05rem; }
.mission-done .md-sub { color:var(--brand); font-weight:700; font-size:.85rem; margin-top:4px; }
.mission-done .md-btn { margin-top:12px; background:var(--brand); color:#fff; border:none; border-radius:12px;
  padding:11px 18px; font-weight:900; font-size:.9rem; cursor:pointer; }

/* 대화 연장 광고 게이트 */
.card.gate { background:var(--accent-soft); border:0; text-align:center; }
.card.gate .gate-title { color:var(--accent); font-weight:900; font-size:1.05rem; margin-bottom:6px; }
.card.gate .gate-body { color:var(--accent); font-size:.9rem; line-height:1.5; margin-bottom:14px; }
.card.gate .gate-btn { display:block; width:100%; background:var(--accent); color:#fff; border:none; border-radius:14px;
  padding:14px; font-weight:900; font-size:1rem; cursor:pointer; }
.card.gate .gate-btn:disabled { opacity:.6; cursor:default; }
.card.gate .gate-alt { background:none; border:none; color:var(--accent); font-weight:700; font-size:.85rem; margin-top:12px; cursor:pointer; }

/* none — 광고 미노출 안내(차분) */
.ai-note { background:var(--inset); border-radius:13px; padding:13px; margin-top:10px; color:var(--muted); font-size:.85rem; line-height:1.5; }
.soft-sug .soft-h { display:flex; align-items:center; gap:7px; }
.soft-sug .soft-ad { background:var(--ad); color:#fff; font-weight:800; font-size:.62rem; padding:2px 6px; border-radius:6px; white-space:nowrap; flex-shrink:0; }

/* 설정 화면 */
.set-sec { color: var(--muted); font-weight: 800; font-size: .9rem; margin: 22px 0 8px; }
.set-card { padding: 0 16px; }
.set-consent { display: flex; align-items: center; gap: 12px; padding: 15px 0; }
.set-consent .tx { flex: 1; }
.set-consent .ct { font-weight: 800; font-size: 1rem; margin-bottom: 3px; }
.set-consent .cd { color: var(--muted); font-size: .82rem; line-height: 1.5; }
.rdiv { border-bottom: 1px solid var(--line); }
.toggle { flex-shrink: 0; width: 52px; height: 31px; border-radius: 999px; background: #cfcabd; padding: 0; min-height: auto; position: relative; transition: background .15s; }
.toggle.on { background: var(--brand); }
.toggle .knob { position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.toggle.on .knob { left: 24px; }
.set-link { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; background: none; padding: 17px 0; min-height: auto; font-size: 1rem; font-weight: 700; color: var(--ink); }
.set-link.danger { color: var(--reversed); }
.set-link .chev { color: var(--muted); font-weight: 300; font-size: 1.3rem; }
.app-info { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 28px; }
.retry-btn { background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 10px 16px; min-height: auto; font-weight: 800; font-size: .95rem; }

/* 온보딩 오버레이 */
.onb { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; padding: 56px 26px 36px; }
.onb-skip { position: absolute; top: 48px; right: 20px; background: none; color: var(--muted); font-weight: 700; font-size: .95rem; min-height: auto; padding: 6px; width: auto; }
.onb-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.onb-emoji { width: 132px; height: 132px; border-radius: 50%; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-size: 4rem; margin-bottom: 28px; }
.onb-title { font-size: 1.8rem; font-weight: 900; line-height: 1.32; color: var(--ink); }
.onb-desc { font-size: 1.05rem; line-height: 1.6; color: var(--ink); margin-top: 16px; max-width: 340px; }
.onb-point { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-top: 20px; color: var(--brand); font-weight: 800; font-size: .95rem; }
.onb-dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
.onb-dots span { width: 9px; height: 9px; border-radius: 5px; background: var(--line); transition: width .2s; }
.onb-dots span.on { background: var(--brand); width: 24px; }
.onb-cta { background: var(--brand); color: #fff; border-radius: 18px; padding: 17px; width: 100%; font-size: 1.2rem; font-weight: 900; }

/* FAQ */
.faq-q { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; padding: 16px 0; min-height: auto; font-size: .98rem; font-weight: 700; color: var(--ink); }
.faq-a { color: var(--muted); font-size: .9rem; line-height: 1.6; padding: 0 8px 16px 0; }
.set-replay { background: var(--brand-soft); color: var(--brand); border-radius: 12px; padding: 11px 16px; min-height: auto; font-weight: 800; font-size: .95rem; margin-top: 10px; width: auto; }

/* 안전 안내 카드 */
.safety { border-radius: 16px; border: 1px solid; padding: 16px; margin-top: 10px; }
.safety.critical { background: #fdecea; border-color: #f3c4bd; }
.safety.warn { background: #fbf6ea; border-color: #eedec0; }
.safety-title { font-weight: 900; font-size: 1.02rem; line-height: 1.4; color: var(--accent); margin-bottom: 6px; }
.safety.critical .safety-title { color: #a01818; }
.safety-body { font-size: .95rem; line-height: 1.6; color: var(--ink); }
.safety-res { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.res-btn { display: flex; align-items: center; gap: 8px; background: #fff; border: 0; border-radius: 12px; padding: 10px 13px; text-decoration: none; }
.res-btn .rl { color: var(--muted); font-weight: 700; font-size: .82rem; }
.res-btn .rv { color: #a01818; font-weight: 900; font-size: .95rem; }

/* 후속 질문 유도 */
.follow-wrap { margin-top: 10px; }
.follow-head { color: var(--muted); font-weight: 800; font-size: .85rem; margin-bottom: 8px; }
.follow-chip { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; background: var(--card); border: 0; border-radius: 14px; padding: 13px 15px; margin-bottom: 8px; font-weight: 700; color: var(--brand-dark); font-size: .98rem; }
.follow-chip .fa { color: var(--muted); font-weight: 300; font-size: 1.2rem; }
.follow-chip:active { background: var(--brand-soft); }

/* 오늘의 이야기(선제 대화) */
.pro-card { background: var(--brand); border-radius: 20px; padding: 18px; margin-bottom: 20px; box-shadow: 0 10px 26px rgba(14,122,95,.28); }
.pro-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.pro-title { color: rgba(255,255,255,.9); font-weight: 800; font-size: .82rem; }
.pro-w { color: #fff; font-weight: 800; font-size: .82rem; }
.pro-msg { color: #fff; font-size: 1.05rem; font-weight: 700; line-height: 1.5; margin-bottom: 14px; }
.pro-topic { display: block; width: 100%; text-align: left; background: rgba(255,255,255,.16); color: #fff; border-radius: 14px; padding: 13px 14px; font-weight: 800; font-size: 1rem; min-height: auto; }
.pro-action { margin-top: 10px; background: #fff; color: var(--brand-dark); border-radius: 12px; padding: 10px 15px; font-weight: 900; font-size: .9rem; min-height: auto; width: auto; }
.uncertain-note { color: var(--muted); font-size: .8rem; line-height: 1.5; margin-top: 12px; }

/* 데모 안내 바 + 아티팩트 표시 보정 */
:root { color-scheme: light; }
.demo-note { display:flex; align-items:center; justify-content:center; gap:4px; text-align:center; font-size:.78rem; font-weight:700; color:var(--muted); background:var(--inset); padding:6px 12px; }
.demo-note.on { background:var(--brand-soft); color:var(--brand-dark); }
.note-btn { margin-left:6px; padding:5px 11px; min-height:auto; border-radius:9px; font-size:.75rem; background:var(--brand); color:#fff; font-weight:800; }
.note-btn.off { background:var(--card); color:var(--muted); }

// 탭 전환에도 대화가 유지되도록 렌더된 메시지 노드를 보관
let chatLog = [];
function scrollChatToEnd() {
  const t = document.querySelector("#thread");
  if (t && t.lastElementChild) setTimeout(() => t.lastElementChild.scrollIntoView({ behavior: "smooth", block: "end" }), 60);
}

async function ask(text) {
  const input = document.querySelector("#q");
  const q = (text ?? (input ? input.value : "")).trim(); if (!q) return;
  const thread = document.querySelector("#thread");
  if (input) input.value = "";
  // 첫 메시지에서 홈(빈 상태) 숨기고 채팅 모드로 전환
  const emptyState = document.querySelector("#emptyState");
  if (emptyState) emptyState.style.display = "none";
  // 사용자 말풍선을 먼저 아래에 붙이고 스크롤(채팅처럼 순서대로)
  const userMsg = el(`<div class="msg-row"><div class="user-bubble">${esc(q)}</div></div>`);
  thread.appendChild(userMsg); chatLog.push(userMsg);
  const loading = el(`<div class="msg-row"><div class="card answer typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`);
  thread.appendChild(loading);
  scrollChatToEnd();
  try {
    if (!conversationId) conversationId = (await api("/v1/conversations", { method: "POST", body: "{}" })).conversation_id;
    const r = await api(`/v1/conversations/${conversationId}/messages`, { method: "POST", body: JSON.stringify({ text: q }) });
    loading.remove();
    // 무료 대화 소진 → 답변 대신 '광고 보고 이어가기' 카드. 광고 후 방금 질문 자동 전송.
    if (r.gated || !r.answer) {
      const gate = gateCard(r.chat || {}, q);
      thread.appendChild(gate); chatLog.push(gate);
      scrollChatToEnd();
      return;
    }
    // 미션 진행 갱신(완료면 핀 제거 — 축하 카드는 answerBlock에서)
    if (r.mission) {
      activeMission = r.mission.completed ? null : { title: r.mission.title, reward: r.mission.reward, turns: r.mission.turns, turnsRequired: r.mission.turnsRequired };
      renderMissionBar();
    }
    const block = answerBlock(r);
    thread.appendChild(block); chatLog.push(block);
    scrollChatToEnd();
  } catch (err) {
    loading.remove();
    const errNode = el(`<div class="msg-row"><div class="card answer"><div>${esc(err.title || "연결이 잠시 불안정해요.")}</div><button class="retry-btn mt">↻ 다시 시도</button></div></div>`);
    errNode.querySelector(".retry-btn").addEventListener("click", () => { errNode.remove(); const idx = chatLog.indexOf(errNode); if (idx >= 0) chatLog.splice(idx, 1); ask(q); });
    thread.appendChild(errNode); chatLog.push(errNode);
    scrollChatToEnd();
  }
}

// 대화 연장 광고 게이트 — 수익화 미션을 대화에 녹인 카드.
function gateCard(chat, question) {
  const reward = chat.adReward ?? 20, per = chat.perUnlock ?? 5;
  const node = el(`
    <div class="msg-row"><div class="card gate">
      <div class="gate-title">무료 대화를 다 쓰셨어요</div>
      <div class="gate-body">짧은 광고를 보면 대화 ${per}회를 더 할 수 있고, 포인트 ${reward}P도 함께 드려요.</div>
      <button class="gate-btn">🎬 광고 보고 이어가기 (+${reward}P)</button>
      <button class="gate-alt">또는 걸어서 포인트 모으기 ›</button>
    </div></div>`);
  const btn = node.querySelector(".gate-btn");
  btn.addEventListener("click", async () => {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = "광고 보는 중…";
    try {
      await new Promise((r) => setTimeout(r, 1400)); // 광고 재생 대체(실 SDK 연동 지점)
      await api("/v1/chat/ad", { method: "POST", body: "{}" });
      refreshWallet();
      const idx = chatLog.indexOf(node); if (idx >= 0) chatLog.splice(idx, 1);
      node.remove();
      ask(question); // 방금 질문 자동 재전송
    } catch (e) { btn.disabled = false; btn.textContent = `🎬 광고 보고 이어가기 (+${reward}P)`; }
  });
  node.querySelector(".gate-alt").addEventListener("click", () => document.querySelector(`#tabbar button[data-tab="walk"]`)?.click());
  return node;
}

function answerBlock(r) {
  const a = r.answer;
  const sections = a.sections.map((s) => `<div class="section"><div class="h">${esc(s.title)}</div><div>${esc(s.body)}</div></div>`).join("");
  const block = el(`
    <div class="msg-row">
      <div class="card answer">
        <div class="ai-badge-row"><span class="ai-badge">AI</span><span class="muted" style="font-weight:700">AI 답변</span></div>
        <div class="summary">${esc(a.summary)}</div>
        ${sections}
        ${a.uncertainty && a.uncertainty.message ? `<div class="uncertain-note">ⓘ ${esc(a.uncertainty.message)}</div>` : ""}
      </div>
      <div id="ad"></div>
    </div>`);
  const ad = block.querySelector("#ad");
  if (r.safetyNotice) ad.appendChild(safetyCard(r.safetyNotice));
  // 대화 미션 완료 축하 — 대화로 돈 벌었음을 즉시 체감시킨다.
  if (r.mission && r.mission.completed) {
    const cel = el(`<div class="mission-done">
      <div class="md-title">🎉 미션 완료! +${r.mission.reward}P 적립</div>
      <div class="md-sub">${esc(r.mission.sponsor)} · ${esc(r.mission.title)}</div>
      <button class="md-btn">내 보상에서 확인 ›</button>
    </div>`);
    cel.querySelector(".md-btn").addEventListener("click", () => document.querySelector('#tabbar button[data-tab="reward"]')?.click());
    ad.appendChild(cel);
    refreshWallet();
  }
  const need = r.needLevel || (r.matched && r.matched.benefits && r.matched.benefits.length ? "ready" : "none");
  const benefits = (r.matched && r.matched.benefits) || (r.commercial ? [r.commercial] : []);
  const missions = (r.matched && r.matched.missions) || [];

  if (need === "ready") {
    benefits.forEach((o) => ad.appendChild(offerCard(o, r.answerSnapshotId)));
    missions.forEach((o) => ad.appendChild(offerCard(o, r.answerSnapshotId)));
  } else if (need === "exploring" && benefits.length) {
    ad.appendChild(softSuggestion(benefits[0], r.answerSnapshotId));
  }

  if (r.rewardNudge) ad.appendChild(nudgeChip(r.rewardNudge));

  if (need === "none" && !r.rewardNudge && !r.safetyNotice) {
    ad.appendChild(el(`<div class="ai-note">지금은 안내에 집중했어요. 필요한 순간에만 혜택을 연결해 드려요.</div>`));
  }

  // 후속 질문 유도 — 탭하면 이어서 물어봄
  if (Array.isArray(r.followUps) && r.followUps.length) {
    const fw = el(`<div class="follow-wrap"><div class="follow-head">이어서 물어보기</div></div>`);
    r.followUps.slice(0, 2).forEach((q) => {
      const c = el(`<button class="follow-chip"><span>${esc(q)}</span><span class="fa">›</span></button>`);
      c.addEventListener("click", () => ask(q));
      fw.appendChild(c);
    });
    ad.appendChild(fw);
  }
  return block;
}

// 안전 안내 카드(사기·위기·건강·금융). 상담 번호는 tel: 링크.
function safetyCard(n) {
  const critical = n.level === "critical";
  const res = (n.resources || []).map((r) => `<a class="res-btn" href="tel:${esc(r.value.replace(/[^0-9]/g, ""))}"><span class="rl">${esc(r.label)}</span><span class="rv">📞 ${esc(r.value)}</span></a>`).join("");
  return el(`<div class="safety ${critical ? "critical" : "warn"}">
    <div class="safety-title">${critical ? "🛑 " : "ℹ️ "}${esc(n.title)}</div>
    <div class="safety-body">${esc(n.body)}</div>
    ${res ? `<div class="safety-res">${res}</div>` : ""}
  </div>`);
}

// exploring: 부드러운 제안 — 누르면 카드가 펼쳐진다(포인트 앞세움)
function softSuggestion(o, answerSnapshotId) {
  const wrap = el(`<div>
    <button class="soft-sug">
      <span class="e">💡</span>
      <span class="tx"><span class="soft-h"><b>관련 혜택이 있어요</b><span class="soft-ad">광고·제휴</span></span><span class="sub">${esc(o.title)} · 확정 시 최대 ${won(o.expectedReward)}</span></span>
      <span class="tg">보기</span>
    </button>
    <div class="soft-body" style="display:none"></div>
  </div>`);
  const btn = wrap.querySelector(".soft-sug"), body = wrap.querySelector(".soft-body"), tg = wrap.querySelector(".tg");
  let open = false, built = false;
  btn.addEventListener("click", () => {
    open = !open;
    if (open && !built) { body.appendChild(offerCard(o, answerSnapshotId)); built = true; }
    body.style.display = open ? "block" : "none";
    tg.textContent = open ? "접기" : "보기";
  });
  return wrap;
}

// 대화 맥락 리워드 넛지 — 걷기/미션 탭으로 연결
function nudgeChip(kind) {
  const walk = kind === "walk";
  const c = el(`<button class="nudge-chip"><span class="e">${walk ? "👟" : "🎯"}</span><span class="tx">${walk ? "지금 걸으면 포인트가 쌓여요" : "짧은 미션으로 포인트 모으기"}</span><span class="go">바로가기 ›</span></button>`);
  c.addEventListener("click", () => { const t = walk ? "walk" : "mission"; document.querySelector(`#tabbar button[data-tab="${t}"]`).click(); });
  return c;
}

// ---------- 오퍼 카드 ----------
function offerCard(o, answerSnapshotId) {
  const rental = o.isRental;
  const chips = [
    o.autoRenewal
      ? `<span class="chip warn">⚠︎ ${rental ? "자동결제·의무약정 " + o.mandatoryMonths + "개월" : "자동결제 있음"}</span>`
      : `<span class="chip ok">✓ 자동결제 없음</span>`,
    `<span class="chip ok">✓ ${rental ? "언제든 상담 취소 가능" : "취소·환불 가능"}</span>`,
    o.dataSharing === "없음" ? `<span class="chip ok">✓ 연락처 미전달</span>` : `<span class="chip warn">⚠︎ 연락처 전달</span>`,
  ].join("");
  const inset = rental
    ? `<div class="row"><span class="k">월 렌탈료</span><span class="v accent" style="font-size:1.3rem">${won(o.monthlyFee)}<span class="muted" style="font-size:.8rem;font-weight:600"> /월</span></span></div>
       <div class="divider"></div>
       <div class="row"><span class="k">약정 기간</span><span class="v">${o.contractMonths}개월</span></div>
       <div class="row"><span class="k">의무 사용</span><span class="v">${o.mandatoryMonths}개월</span></div>
       <div class="row"><span class="k">총 예상 비용</span><span class="v">${won(o.totalCost)}</span></div>
       <div class="row"><span class="k">설치 확정 시 보상</span><span class="v accent">최대 ${won(o.expectedReward)}</span></div>`
    : `<div class="row"><span class="k">총비용</span><span class="v" style="font-size:1.3rem">${won(o.totalCost)}</span></div>
       <div class="divider"></div>
       <div class="row"><span class="k">확정 시 최대 보상</span><span class="v accent">${won(o.expectedReward)}</span></div>
       <div class="row"><span class="k">확정 시점</span><span class="v" style="font-weight:600">${esc(o.approvalWindow)}</span></div>`;
  const c = el(`
    <div class="card offer mt">
      <div class="toprow"><span class="ad-label">광고·제휴</span><span class="advertiser">${esc(o.advertiserName)}</span><span class="cat-tag">${rental ? "렌탈 제휴" : o.category === "survey" ? "미션 제휴" : "쇼핑 제휴"}</span></div>
      <h3>${rental ? "🚰 " : ""}${esc(o.title)}</h3>
      <div class="muted" style="margin-bottom:8px">${esc(o.recommendationReason)}</div>
      <div class="inset">${inset}</div>
      <div class="chips">${chips}</div>
      <button class="btn btn-primary mt">${rental ? "설치 상담 신청하기" : "제휴처에서 조건을 확인합니다"}</button>
    </div>`);
  c.querySelector("button").addEventListener("click", () => (rental ? openLeadForm(o) : goExternal(o, answerSnapshotId)));
  return c;
}

// 렌탈 설치 상담 신청 폼(모달)
function openLeadForm(o) {
  const m = el(`<div class="modal-bg"><div class="lead-modal">
    <h3 style="margin:0 0 4px">설치 상담 신청</h3>
    <div class="muted" style="margin-bottom:14px">${esc(o.title)} · ${esc(o.advertiserName)}</div>
    <label class="fl">이름</label><input id="ln" placeholder="성함" />
    <label class="fl">연락처</label><input id="lp" placeholder="010-0000-0000" inputmode="tel" />
    <label class="fl">설치 주소</label><input id="la" placeholder="설치할 주소" />
    <label class="fl">희망 상담 시간 (선택)</label><input id="lt" placeholder="예: 평일 오후" />
    <div class="lead-disclose">
      <b>개인정보 제3자 제공 안내</b><br>
      · 제공받는 자: ${esc(o.advertiserName)}<br>· 제공 항목: ${esc(o.dataSharing)}<br>· 목적: 렌탈 설치 상담·계약<br>
      · 보유·이용기간: 상담 종료 후 파기<br>· 월 ${won(o.monthlyFee)} · 약정 ${o.contractMonths}개월 · 의무 ${o.mandatoryMonths}개월 · 자동결제 있음
    </div>
    <label class="lead-check"><input type="checkbox" id="lc" /> 위 개인정보 제3자 제공에 동의합니다 (필수)</label>
    <button class="btn btn-primary" id="lsubmit">상담 신청하기</button>
    <button class="btn" id="lcancel" style="width:100%;background:none;color:var(--muted)">닫기</button>
  </div></div>`);
  document.body.appendChild(m);
  m.querySelector("#lcancel").addEventListener("click", () => m.remove());
  m.querySelector("#lsubmit").addEventListener("click", async () => {
    const name = m.querySelector("#ln").value.trim(), phone = m.querySelector("#lp").value.trim(), address = m.querySelector("#la").value.trim();
    const time = m.querySelector("#lt").value.trim(), agree = m.querySelector("#lc").checked;
    if (!name || !phone || !address) return toast("이름·연락처·설치 주소를 입력해주세요.");
    if (!agree) return toast("개인정보 제3자 제공 동의가 필요해요.");
    try {
      await api("/v1/consents/third_party", { method: "PUT", body: JSON.stringify({ granted: true }) });
      const r = await api(`/v1/offers/${o.offerSnapshotId}/lead`, { method: "POST", headers: { "Idempotency-Key": idem() }, body: JSON.stringify({ name, phone, address, preferred_time: time || undefined }) });
      await api(`/v1/dev/simulate-conversion`, { method: "POST", body: JSON.stringify({ supplier: "sup_rental", source: "rental_cpa", click_id: r.click_id, gross_amount: o.totalCost || 0 }) }).catch(() => {});
      m.remove();
      toast(`상담 신청 완료 · ${o.advertiserName}에서 연락 예정`);
      refreshWallet();
    } catch (e) { toast(e.title || "신청 실패"); }
  });
}

async function goExternal(o, answerSnapshotId) {
  const warn = o.isRental ? `이 상품은 정기결제(자동결제)와 의무약정 ${o.mandatoryMonths}개월이 있어요.\n` : "";
  if (!confirm(`제휴처(${o.advertiserName})로 이동합니다.\n${warn}· 개인정보 전달: ${o.dataSharing}\n· 비식별 클릭 ID만 전달됩니다.\n계속할까요?`)) return;
  try {
    await doClickAndConvert(o, answerSnapshotId);
  } catch (err) {
    // 제3자 제공 동의 필요(렌탈 리드 등) → 동의 후 재시도
    if (err.code === "CONSENT_REQUIRED") {
      if (confirm(`${err.detail || "개인정보 제3자 제공 동의가 필요합니다."}\n\n동의하고 계속할까요?`)) {
        await api("/v1/consents/third_party", { method: "PUT", body: JSON.stringify({ granted: true }) });
        try { await doClickAndConvert(o, answerSnapshotId); } catch (e) { toast(e.title || "진행 실패"); }
      }
      return;
    }
    toast(err.title || "이동 링크 생성 실패");
  }
}
async function doClickAndConvert(o, answerSnapshotId) {
  const r = await api(`/v1/offers/${o.offerSnapshotId}/clicks`, { method: "POST", headers: { "Idempotency-Key": idem() }, body: JSON.stringify({ answer_snapshot_id: answerSnapshotId || null }) });
  await simulateConversion(o, r.click_id);
}
async function simulateConversion(o, clickId) {
  const map = o.category === "survey" ? ["sup_offerwall", "offerwall_cpa"] : o.isRental ? ["sup_rental", "rental_cpa"] : ["sup_linkprice", "shopping_cps"];
  // 데모: 서버의 dev 시뮬레이터를 통해 전환 생성(실 postback은 공급사 HMAC 서명 필요)
  await api(`/v1/dev/simulate-conversion`, { method: "POST", body: JSON.stringify({ supplier: map[0], source: map[1], click_id: clickId, gross_amount: o.totalCost || 10000 }) });
  toast(o.isRental ? "상담 접수됨 · 내 보상에서 확인 중 확인" : "전환 접수됨 · 내 보상에서 '확인 중'");
  refreshWallet();
}

// ---------- 혜택(쇼핑/렌탈) & 미션 ----------
async function renderShop() {
  await renderOfferList([{ k: "shopping", l: "쇼핑·예약" }, { k: "rental", l: "렌탈" }], "혜택", "검수된 제휴 상품이에요. 총비용과 조건을 꼭 확인하세요.");
}
async function renderMission() {
  await renderOfferList([{ k: "mission", l: "미션" }], "미션", "설문·가입 등 행동을 완료하면 보상을 받아요. 소요시간과 개인정보 전달을 먼저 확인하세요.");
}
async function renderOfferList(segs, title, sub, seg) {
  const cur = seg || segs[0].k;
  const v = document.querySelector("#view");
  v.innerHTML = `<h2 class="title">${title}</h2><p class="sub">${sub}</p>`;
  if (segs.length > 1) {
    const bar = el(`<div class="segbar"></div>`);
    segs.forEach((s) => { const b = el(`<button class="seg ${s.k === cur ? "active" : ""}">${s.l}</button>`); b.addEventListener("click", () => renderOfferList(segs, title, sub, s.k)); bar.appendChild(b); });
    v.appendChild(bar);
  }
  if (cur === "rental") v.appendChild(el(`<div class="notice">렌탈은 매달 요금이 나가는 정기결제 상품이에요. 월 요금·약정·의무기간을 꼭 확인하세요.</div>`));
  const list = el(`<div id="list" class="muted">불러오는 중…</div>`); v.appendChild(list);
  try {
    const { offers } = await api(`/v1/offers?type=${cur}`);
    list.innerHTML = ""; list.classList.remove("muted");
    if (!offers.length) { list.textContent = "지금은 조건을 만족하는 혜택이 없어요."; list.classList.add("muted"); return; }
    // 쇼핑은 토스쇼핑식 상품 행(탭하면 상세 카드 펼침), 렌탈·미션은 조건 고지가 중요해 상세 카드 그대로.
    if (cur === "shopping") offers.forEach((o) => list.appendChild(productRow(o)));
    else offers.forEach((o) => list.appendChild(offerCard(o, null)));
  } catch { list.textContent = "불러오지 못했어요."; }
}

// 토스쇼핑식 상품 행 — [썸네일] [상품명·판매처] [가격 + 적립] › . 탭하면 상세 카드 펼침.
const PRODUCT_EMOJI = [
  [/홍삼|인삼|영양|비타민/, "🫖"], [/무릎|보호대|찜질/, "🦵"], [/워킹화|운동화|신발/, "👟"],
  [/베개|이불|침구|매트/, "🛏️"], [/필터|청정기/, "🌬️"], [/호텔|숙박/, "🏨"], [/항공|비행/, "✈️"],
];
function productEmoji(title) { for (const [re, e] of PRODUCT_EMOJI) if (re.test(title)) return e; return "🛍️"; }
function productRow(o) {
  const wrap = el(`<div></div>`);
  // 토스쇼핑 문법: 가격은 상품명 '아래'(오른쪽 열 아님) — 상품명이 꺾이지 않는다.
  const row = el(`<button class="p-row">
    <span class="p-thumb">${productEmoji(o.title)}</span>
    <span class="p-body">
      <span class="p-name">${esc(o.title)}</span>
      <span class="p-price">${won(o.totalCost)}</span>
      <span class="p-meta"><span class="p-cash">최대 ${won(o.expectedReward)} 적립</span><span class="m-ad">광고·제휴</span>${esc(o.advertiserName)}</span>
    </span>
    <span class="p-arrow">›</span>
  </button>`);
  let open = false, detail = null;
  row.addEventListener("click", () => {
    open = !open;
    if (open) { detail = offerCard(o, null); wrap.appendChild(detail); }
    else if (detail) { detail.remove(); detail = null; }
  });
  wrap.appendChild(row);
  return wrap;
}

// ---------- 걷기 ----------
async function renderWalk() {
  const v = document.querySelector("#view");
  v.innerHTML = `<h2 class="title">걷기</h2><p class="sub">걸을수록 마일스톤이 열려요. 광고를 보면 보상을 받습니다.</p><div id="walk" class="muted">불러오는 중…</div>`;
  drawWalk(await api("/v1/cashwalk"));
}
function drawWalk(s) {
  const w = document.querySelector("#walk"); w.classList.remove("muted");
  const pct = Math.min(100, (s.steps / s.dailyCap) * 100);
  const msHtml = Array.from({ length: Math.floor(s.dailyCap / s.stepPerMilestone) }, (_, i) => {
    const m = i + 1;
    const cls = s.claimedMilestones.includes(m) ? "done" : s.claimable.includes(m) ? "claimable" : "locked";
    return `<button class="ms ${cls}" data-m="${m}" ${cls === "claimable" ? "" : "disabled"}>${m}</button>`;
  }).join("");
  w.innerHTML = `
    <div class="card">
      <div class="steps-big">${s.steps.toLocaleString("ko-KR")}</div>
      <div class="center muted">오늘 걸음 (상한 ${s.dailyCap.toLocaleString("ko-KR")}보)</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="row"><span class="k">오늘 받은 보상</span><span class="v" style="color:var(--brand)">${won(s.earnedToday)}</span></div>
      <div class="row"><span class="k">마일스톤당 보상</span><span class="v">${won(s.rewardPerMilestone)} (${s.stepPerMilestone.toLocaleString("ko-KR")}보마다)</span></div>
      <button class="btn btn-ghost mt" id="add" style="width:100%">+1,000보 (데모 걷기)</button>
    </div>
    <div class="card">
      <h3>마일스톤</h3><p class="muted" style="margin-top:0">주황색은 광고 보고 받기 가능, 초록색은 받음.</p>
      <div class="milestones">${msHtml}</div>
      <div class="disclose">보상 재원은 잠금화면·리워드 광고입니다. 걸음 자체가 아니라 '광고 시청'에 대해 지급돼요.</div>
    </div>`;
  w.querySelector("#add").addEventListener("click", async () => drawWalk(await api("/v1/cashwalk/steps", { method: "POST", body: JSON.stringify({ steps: s.steps + 1000, device_integrity_ok: true }) })));
  w.querySelectorAll(".ms.claimable").forEach((b) => b.addEventListener("click", () => {
    toast("광고 시청 중…(데모 2초)");
    setTimeout(async () => {
      try { await api("/v1/cashwalk/claims", { method: "POST", body: JSON.stringify({ milestone: Number(b.dataset.m), ad_impression_id: "imp_" + idem() }) }); toast("보상 지급! 내 보상에서 확인"); drawWalk(await api("/v1/cashwalk")); refreshWallet(); }
      catch (e) { toast(e.title || "청구 실패"); }
    }, 2000);
  }));
}

async function renderReward() {
  const v = document.querySelector("#view");
  const w = await refreshWallet();
  const { rewards } = await api("/v1/rewards");
  v.innerHTML = `<h2 class="title">내 보상</h2>`;
  v.appendChild(el(`
    <div class="card">
      <div class="center"><div class="muted" style="font-weight:700">사용 가능</div><div class="big-amount" style="color:var(--brand)">${won(w.available)}</div></div>
      <div class="row mt"><span class="pill pending">확인 중</span><span class="v">${won(w.pending)}</span></div>
      <div class="row"><span class="pill paid">사용 완료</span><span class="v">${won(w.used)}</span></div>
      <button class="btn btn-primary mt" id="exchange" ${w.available < 3000 ? "disabled" : ""}>3,000원 쿠폰으로 교환하기</button>
      <div class="disclose">확인 중 금액은 아직 사용할 수 없어요. 광고주 확인이 끝나면 '사용 가능'으로 바뀝니다.</div>
    </div>`));
  const list = el(`<div><h3 class="title" style="font-size:1.2rem">거래 내역</h3></div>`);
  if (!rewards.length) list.appendChild(el(`<div class="card muted">아직 거래가 없어요. AI 도움·혜택·미션·걷기로 보상을 모아보세요.</div>`));
  rewards.forEach((r) => {
    const cls = r.state === "available" ? "available" : r.state === "reversed" ? "reversed" : r.state === "paid" ? "paid" : "pending";
    const card = el(`<div class="card">
        <div class="row"><span style="font-weight:800">${esc(r.title)}</span><span class="pill ${cls}">${r.state_label}</span></div>
        <div class="row"><span class="k">${sourceLabel(r.source) === r.title ? "" : esc(sourceLabel(r.source))}</span><span class="v">${won(r.amount)}</span></div>
        <button class="btn btn-ghost" data-id="${r.reward_transaction_id}" style="width:100%">진행 상태 보기</button>
      </div>`);
    card.querySelector("button").addEventListener("click", () => showTimeline(r.reward_transaction_id));
    list.appendChild(card);
  });
  v.appendChild(list);
  v.querySelector("#exchange")?.addEventListener("click", () => exchange(w.available));
}
async function showTimeline(rid) {
  const r = await api(`/v1/rewards/${rid}`);
  alert(`${r.title}\n상태: ${r.state_label} · ${won(r.amount)}\n\n[타임라인]\n` + r.timeline.map((t) => `• ${t.reason} (${new Date(t.created_at).toLocaleString("ko-KR")})`).join("\n"));
}
async function exchange(available) {
  // 상품 카탈로그가 3,000원 쿠폰 1종 → 상품과 금액 일치.
  const amount = 3000;
  if (available < amount) return toast("3,000원 쿠폰 교환에는 최소 3,000원이 필요해요.");
  if (!confirm(`${won(amount)}을 모바일 쿠폰으로 교환할까요?`)) return;
  try {
    const r = await api("/v1/payouts", { method: "POST", headers: { "Idempotency-Key": idem() }, body: JSON.stringify({ amount, product_id: "coupon_3000" }) });
    if (r.status === "paid") toast(`교환 완료! 쿠폰번호 ${r.coupon_code}`);
    else if (r.status === "unknown") toast("확인 중이에요. 잔액은 보호됩니다.");
    else toast("교환 실패 · 잔액이 복구됐어요.");
    renderReward();
  } catch (e) { toast(e.title || "교환 실패"); }
}

function sourceLabel(s) { return ({ shopping_cps: "쇼핑 적립", offerwall_cpa: "미션 보상", cashwalk_ad: "걷기 보상", rental_cpa: "렌탈 보상", chat_ad: "대화 연장 보상", sponsor_chat: "대화 미션 보상" })[s] || s; }

function showOnboarding() {
  let i = 0;
  const ov = el(`<div class="onb"></div>`);
  function draw() {
    const st = ONB_STEPS[i], last = i === ONB_STEPS.length - 1;
    ov.innerHTML = `
      <button class="onb-skip">건너뛰기</button>
      <div class="onb-body">
        <div class="onb-emoji">${st.emoji}</div>
        <div class="onb-title">${st.title}</div>
        <div class="onb-desc">${esc(st.body)}</div>
        <div class="onb-point">✓ ${esc(st.point)}</div>
      </div>
      <div class="onb-dots">${ONB_STEPS.map((_, k) => `<span class="${k === i ? "on" : ""}"></span>`).join("")}</div>
      <button class="onb-cta">${last ? "시작하기" : "다음"}</button>`;
    ov.querySelector(".onb-skip").addEventListener("click", done);
    ov.querySelector(".onb-cta").addEventListener("click", () => { if (last) done(); else { i++; draw(); } });
  }
  function done() { __store.setItem("hyeaek_onboarded", "1"); ov.remove(); }
  draw();
  document.body.appendChild(ov);
}

  acct.querySelector("#logout").addEventListener("click", () => {
    if (!confirm("로그아웃하면 이 기기의 게스트 세션이 초기화돼요. 계속할까요?")) return;
    TOKEN = ""; __store.removeItem("hyeaek_token"); __store.removeItem("hyeaek_device");
    toast("로그아웃했어요. 새 세션으로 다시 시작합니다.");
    ensureSession().then(render).catch(() => render());
  });
  v.appendChild(acct);
  v.appendChild(el(`<div class="app-info">혜택AI · 버전 0.1.0</div>`));
}

function openDoc(title, body) {
  const m = el(`<div class="modal-bg"><div class="lead-modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">${esc(title)}</h3><button class="btn" id="dc" style="width:auto;min-height:auto;background:none;color:var(--brand);padding:6px 10px">닫기</button></div><div style="max-height:56vh;overflow:auto;white-space:pre-line;line-height:1.7;font-size:.95rem">${esc(body)}</div></div></div>`);
  document.body.appendChild(m);
  m.querySelector("#dc").addEventListener("click", () => m.remove());
  m.addEventListener("click", (e) => { if (e.target === m) m.remove(); });
}

// 세션 보장 후 첫 렌더
ensureSession().then(render).catch(() => render());
// 첫 실행 온보딩(1회)
if (!__store.getItem("hyeaek_onboarded")) showOnboarding();

renderNote();
</script>
</body></html>
