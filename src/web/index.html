<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3" />
  <title>혜택AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">혜택<span>AI</span></div>
    <div class="wallet-mini" id="walletMini">사용 가능 <b>0</b>원</div>
  </header>

  <main id="view"><!-- 탭별 화면이 렌더됨 --></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="ai" class="active"><span class="ic">💬</span>AI 도움</button>
    <button data-tab="shop"><span class="ic">🛍️</span>혜택</button>
    <button data-tab="mission"><span class="ic">🎯</span>미션</button>
    <button data-tab="walk"><span class="ic">👟</span>걷기</button>
    <button data-tab="reward"><span class="ic">💰</span>내 보상</button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
